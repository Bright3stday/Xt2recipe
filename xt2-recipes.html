<style>
:root{
  --bg:#141414;--s1:#1e1e1e;--s2:#272727;--s3:#303030;
  --b:rgba(255,255,255,.09);--bs:rgba(255,255,255,.14);
  --t1:#ebebeb;--t2:#aaa;--t3:#666;
  --acc:#c87535;--grn:#3a9e5f;--warn:#b89020;
  --r:10px;
}
@media(prefers-color-scheme:light){:root{
  --bg:#f0ede8;--s1:#fff;--s2:#fff;--s3:#f5f2ee;
  --b:rgba(0,0,0,.09);--bs:rgba(0,0,0,.16);
  --t1:#111;--t2:#555;--t3:#999;
  --acc:#a0600a;--grn:#1f7a3f;--warn:#8a6800;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:680px;margin:0 auto;padding-bottom:68px;min-height:100vh}
input{background:var(--s2);border:1px solid var(--b);border-radius:var(--r);color:var(--t1);font-size:15px;outline:none;padding:10px 14px;width:100%;-webkit-appearance:none}
input:focus{border-color:var(--acc)}
button{cursor:pointer;font-family:inherit;font-size:14px;border:none;background:none;color:inherit}
a{color:var(--acc)}
.pills{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{border:1px solid var(--bs);border-radius:20px;color:var(--t2);flex-shrink:0;font-size:12px;padding:5px 12px;white-space:nowrap;background:var(--s2);transition:all .15s}
.pill.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--s2);border:1px solid var(--b);border-left:3px solid #888;border-radius:var(--r);margin-bottom:9px;overflow:hidden}
.card-head{align-items:center;cursor:pointer;display:flex;gap:10px;min-height:56px;padding:10px 14px;user-select:none}
.card-meta{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.badge{border-radius:8px;font-size:10px;font-weight:600;padding:2px 6px}
.b-top{background:rgba(184,144,32,.18);color:var(--warn)}
.b-ok{background:rgba(58,158,95,.18);color:var(--grn)}
.b-bw{background:var(--s3);color:var(--t3)}
.card-name{font-size:15px;font-weight:600;line-height:1.2}
.card-sim{color:var(--t3);font-family:monospace;font-size:11px;margin-top:2px}
.fav{color:var(--t3);font-size:20px;flex-shrink:0;padding:4px 6px;line-height:1;transition:color .15s}
.fav.on{color:#e87ba4}
.chev{color:var(--t3);flex-shrink:0;font-size:18px;line-height:1;transition:transform .2s}
.chev.open{transform:rotate(180deg)}
.card-body{padding:0 14px 14px}
.desc{color:var(--t2);font-size:12px;line-height:1.6;margin-bottom:10px}
.settings{background:var(--s3);border-radius:8px;border:1px solid var(--b);padding:10px 12px}
.srow{display:flex;font-size:12px;gap:8px;line-height:1.9;font-family:monospace}
.sk{color:var(--t3);flex-shrink:0;min-width:84px}
.sv{color:var(--t1);font-weight:600}
.tip{background:rgba(184,144,32,.12);border:1px solid rgba(184,144,32,.3);border-radius:var(--r);font-size:11px;line-height:1.5;margin-bottom:12px;padding:8px 12px;color:var(--warn)}
.tip strong{font-weight:600}
.mood-grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.mood-card{background:var(--s2);border:1px solid var(--b);border-left:3px solid #888;border-radius:var(--r);cursor:pointer;padding:14px 12px;text-align:left;transition:opacity .1s;width:100%}
.mood-card:active{opacity:.7}
.mood-ico{font-size:20px;line-height:1}
.mood-nm{color:var(--t1);font-size:13px;font-weight:600;margin-top:6px;line-height:1.2}
.mood-ds{color:var(--t2);font-size:11px;line-height:1.4;margin-top:3px}
.mood-ct{color:var(--t3);font-size:10px;margin-top:6px}
#tabs{background:var(--s1);border-top:1px solid var(--b);bottom:0;display:flex;left:0;max-width:680px;margin:0 auto;position:fixed;right:0;z-index:100}
.tab{align-items:center;color:var(--t3);display:flex;flex:1;flex-direction:column;font-size:10px;gap:2px;padding:9px 0 10px;transition:color .15s}
.tab.on{color:var(--acc)}
.tab-ico{font-size:22px;line-height:1}
.shuffle-btn{align-items:center;background:var(--s2);border:1px solid var(--bs);border-radius:var(--r);color:var(--t1);display:flex;font-size:15px;font-weight:600;gap:10px;justify-content:center;margin-top:8px;padding:15px;width:100%}
.shuffle-btn:active{background:var(--s3)}
.back-btn{align-items:center;color:var(--t2);display:flex;font-size:13px;gap:5px;margin-bottom:12px}
.mood-hd{align-items:center;display:flex;gap:12px;margin-bottom:14px}
.empty{color:var(--t3);font-size:13px;padding:3rem;text-align:center}
.count{color:var(--t3);font-size:11px;margin-bottom:10px}
.pad{padding:14px 14px 0}
.warn-note{background:rgba(192,64,64,.12);border:1px solid rgba(192,64,64,.3);border-radius:4px;color:#e07070;font-size:10px;padding:2px 6px;margin-top:4px;display:inline-block}
.sr-only{clip:rect(0 0 0 0);clip-path:inset(50%);height:1px;overflow:hidden;position:absolute;white-space:nowrap;width:1px}
</style>

{id:"acros-push",name:"Acros Push Process",cat:"b",sim:"Acros (Y/R/G)",sk:"acr",top:null,
 s:{fs:"Acros (Y, R, or G)",dr:"DR200",hi:"+4",sh:"+3",nr:"-3",sharp:"+1",grain:"Strong",wb:"Auto",iso:"Auto, max 6400",ec:"+1 typical"},
 desc:"Contrasty, dramatic pushed-film look.",
 m:["bw-doc","night","moody"]},
{id:"agfa-scala",name:"Agfa Scala",cat:"b",sim:"Acros (Y/R/G)",sk:"acr",top:null,
 s:{fs:"Acros (Y, R, or G)",dr:"DR100",hi:"+4",sh:"0",nr:"-3",sharp:"0",grain:"Weak",wb:"Auto",iso:"Auto, max 6400",ec:"−1/3 to +1/3 typical"},
 desc:"High key, clean tones. Happy accident — mimics Agfa Scala 200X B&W reversal.",
 m:["bw-doc","portrait"]},
{id:"analog-mono",name:"Analog Monochrome",cat:"b",sim:"Acros+G",sk:"acr",top:null,
 s:{fs:"Acros+G",dr:"DR400",hi:"+1",sh:"+3",nr:"-4",sharp:"-1",grain:"Weak",wb:"Incandescent −8R −8B",iso:"Auto, max 12800",ec:"+1/3 to +2/3 typical"},
 desc:"X-H1 recipe. Incandescent WB gives extreme blue shift for dramatic monochrome look.",
 m:["bw-doc","street"]},
{id:"ilford-xp2",name:"Ilford XP2 Super 400",cat:"b",sim:"Acros+R",sk:"acr",top:null,
 s:{fs:"Acros+R",dr:"DR400",hi:"-1",sh:"+4",nr:"-4",sharp:"-2",grain:"Strong",wb:"10000K +7R +7B",iso:"Auto, max 12800",ec:"−2/3 to +2/3 typical"},
 desc:"X-H1 recipe. Deep shadows, strong grain, chromogenic B&W character.",
 m:["bw-doc","moody"]},
{id:"ilford-hp5",name:"Ilford HP5 Plus",cat:"b",sim:"Monochrome",sk:"acr",top:null,
 s:{fs:"Monochrome (no filter)",dr:"DR400",hi:"-1",sh:"+1",nr:"-4",sharp:"-2",grain:"Strong (ignore size on X-T2)",wb:"Daylight +1R −8B",iso:"Auto, max 6400",ec:"−2/3 to +2/3 typical"},
 desc:"Uses plain Monochrome (not Acros). Anders Lindborg recipe. Ignore grain size setting.",
 m:["bw-doc"]},
];

const MOODS=[
  {id:"night",ico:"🌙",nm:"Night & tungsten",ds:"Artificial light, neon, street lamps",clr:"#c87535"},
  {id:"street",ico:"🏙",nm:"Urban street",ds:"Everyday, architecture, decisive moments",clr:"#1a8a6f"},
  {id:"japan",ico:"✈",nm:"Japan / travel",ds:"The December trip — colour memory film",clr:"#5147b3"},
  {id:"overcast",ico:"🌧",nm:"Rainy / overcast",ds:"Singapore grey-sky days",clr:"#2260aa"},
  {id:"golden",ico:"☀",nm:"Sunny & golden",ds:"Blue sky, golden hour, bright daylight",clr:"#527d1c"},
  {id:"bw-doc",ico:"📷",nm:"Documentary B&W",ds:"Reportage, grain, contrast",clr:"#555550"},
  {id:"moody",ico:"✦",nm:"Moody & cinematic",ds:"Shadow, teal, film tones",clr:"#c95820"},
  {id:"bold",ico:"◉",nm:"Bold & saturated",ds:"Punch, colour, summer vibrancy",clr:"#9b1a5a"},
  {id:"portrait",ico:"◯",nm:"Portrait / people",ds:"Skin tones, softness, flattery",clr:"#7a3fb3"},
];

const SK=[["fs","Film Sim"],["dr","Dyn. Range"],["hi","Highlight"],["sh","Shadow"],
          ["col","Color"],["nr","Noise Red."],["sharp","Sharpening"],
          ["grain","Grain"],["wb","White Bal."],["iso","ISO"],["ec","Exp. Comp."]];
const SIM_F=[{v:"all",l:"All"},{v:"fav",l:"♥ Saved"},{v:"cc",l:"Classic Chrome"},{v:"png",l:"PRO Neg. Std"},{v:"pnh",l:"PRO Neg. Hi"},{v:"ast",l:"Astia"},{v:"vel",l:"Velvia"},{v:"acr",l:"Acros / B&W"},{v:"prv",l:"Provia"}];

let T="browse",mood=null,q="",sim="all",open=new Set(),favs=new Set(),shuffled=null,sAnim=false;

try{const f=localStorage.getItem("xt2_favs");if(f)favs=new Set(JSON.parse(f));}catch(e){}
function saveFavs(){try{localStorage.setItem("xt2_favs",JSON.stringify([...favs]));}catch(e){}}
shuffled=R[Math.floor(Math.random()*R.length)];

function go(t){T=t;mood=null;render();updateTabs();}
function setMood(m){mood=m;render();}
function toggleOpen(id){open.has(id)?open.delete(id):open.add(id);render();}
function toggleFav(id,e){e&&e.stopPropagation();favs.has(id)?favs.delete(id):favs.add(id);saveFavs();render();}
function setSim(s){sim=s;render();}
function doShuffle(){
  sAnim=true;T="shuffle";render();updateTabs();
  setTimeout(()=>{
    let n;do{n=R[Math.floor(Math.random()*R.length)];}while(n.id===shuffled?.id&&R.length>1);
    shuffled=n;sAnim=false;render();
  },200);
}
function updateTabs(){
  ['browse','moods','shuffle'].forEach(t=>{
    const el=document.getElementById('tb-'+t);
    if(el)el.className='tab'+(T===t?' on':'');
  });
}

function cardHtml(r,forceOpen){
  const isOpen=forceOpen||open.has(r.id);
  const isFav=favs.has(r.id);
  const clr=SC[r.sk]||"#888";
  const badges=(r.top?`<span class="badge b-top">#${r.top} 2024</span>`:"")+
               `<span class="badge b-ok">✓ offline</span>`+
               (r.cat==="b"?`<span class="badge b-bw">B&W</span>`:"");
  const body=isOpen?`<div class="card-body">
    <p class="desc">${r.desc}</p>
    <div class="settings">${SK.filter(([k])=>r.s[k]!=null).map(([k,l])=>`<div class="srow"><span class="sk">${l}</span><span class="sv">${r.s[k]}</span></div>`).join("")}</div>
  </div>`:"";
  return `<div class="card" style="border-left-color:${clr}">
    <div class="card-head" onclick="toggleOpen('${r.id}')">
      <div style="flex:1;min-width:0">
        <div class="card-meta">${badges}</div>
        <div class="card-name">${r.name}</div>
        <div class="card-sim">${r.sim}</div>
      </div>
      <button class="fav${isFav?' on':''}" onclick="toggleFav('${r.id}',event)">${isFav?"♥":"♡"}</button>
      <span class="chev${isOpen?' open':''}">⌄</span>
    </div>${body}</div>`;
}

function render(){
  const app=document.getElementById("app");
  if(!app)return;
  let html="";

  if(T==="browse"){
    const list=R.filter(r=>{
      const lq=q.toLowerCase();
      if(lq&&!r.name.toLowerCase().includes(lq)&&!r.desc.toLowerCase().includes(lq)&&!r.sim.toLowerCase().includes(lq))return false;
      if(sim==="fav")return favs.has(r.id);
      if(sim!=="all"&&r.sk!==sim)return false;
      return true;
    });
    html=`<div class="pad">
      <div style="display:flex;gap:8px;margin-bottom:10px;align-items:center">
        <input type="text" placeholder="Search recipes…" value="${q}" oninput="q=this.value;render()" autocomplete="off" autocorrect="off" spellcheck="false"/>
        <button onclick="doShuffle()" style="background:var(--s2);border:1px solid var(--bs);border-radius:var(--r);padding:9px 12px;color:var(--t2);flex-shrink:0;white-space:nowrap;font-size:13px">⇄ Shuffle</button>
      </div>
      <div class="pills">${SIM_F.map(f=>`<button class="pill${sim===f.v?' on':''}" onclick="setSim('${f.v}')">${f.l}</button>`).join("")}</div>
      <div class="tip"><strong>X-T2 WB shift:</strong> Cannot be saved per C1–C7 preset. Set via IQ Menu → WB → ▶. One shift saved per WB type. Plan your 7 presets around this.</div>
      <p class="count">${list.length} recipe${list.length!==1?"s":""} · all ${R.length} have settings embedded offline</p>
      ${list.map(r=>cardHtml(r,false)).join("")}
      ${!list.length?'<p class="empty">No recipes match.</p>':""}
    </div>`;
  }

  else if(T==="moods"&&!mood){
    html=`<div class="pad">
      <p style="font-size:13px;color:var(--t2);margin-bottom:14px;line-height:1.5">Pick a shooting situation. All recipes now have settings embedded — fully offline.</p>
      <div class="mood-grid">
        ${MOODS.map(m=>{const cnt=R.filter(r=>r.m.includes(m.id)).length;
          return`<button class="mood-card" style="border-left-color:${m.clr}" onclick="setMood('${m.id}')">
            <div class="mood-ico" style="color:${m.clr}">${m.ico}</div>
            <div class="mood-nm">${m.nm}</div>
            <div class="mood-ds">${m.ds}</div>
            <div class="mood-ct">${cnt} recipes</div>
          </button>`;}).join("")}
      </div></div>`;
  }

  else if(T==="moods"&&mood){
    const mData=MOODS.find(m=>m.id===mood);
    const list=R.filter(r=>r.m.includes(mood));
    html=`<div class="pad">
      <button class="back-btn" onclick="setMood(null)">← Back to moods</button>
      <div class="mood-hd">
        <span style="font-size:28px;color:${mData.clr}">${mData.ico}</span>
        <div><div style="font-size:16px;font-weight:600">${mData.nm}</div><div style="font-size:12px;color:var(--t2);margin-top:2px">${mData.ds}</div></div>
      </div>
      ${list.map(r=>cardHtml(r,false)).join("")}
    </div>`;
  }

  else if(T==="shuffle"){
    const card=shuffled?cardHtml(shuffled,true):"";
    html=`<div class="pad">
      <p style="font-size:12px;color:var(--t2);margin-bottom:14px">All ${R.length} recipes available. Tap ♡ to save.</p>
      <div style="opacity:${sAnim?0:1};transition:opacity .18s">${card}</div>
      <button class="shuffle-btn" onclick="doShuffle()"><span style="font-size:22px">⇄</span> Roll again</button>
    </div>`;
  }

  app.innerHTML=html;
}

render();
</script>
</body>
</html>
